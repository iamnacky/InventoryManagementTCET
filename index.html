<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Inventory Management System</h1>
        <p class="subtitle">Basic Inventory Module</p>

        <div class="card">
            <h2>Add Product</h2>
            <form id="productForm">
                <input type="number" id="productId" placeholder="Product ID" min="1" required>
                <input type="text" id="productName" placeholder="Product Name" required>
                <select id="productCategory" required aria-label="Product category">
                    <option value="" selected disabled>Select category</option>
                </select>
                <input type="number" id="productPrice" placeholder="Price" min="0" step="0.01" required>
                <input type="number" id="productQuantity" placeholder="Quantity" min="0" required>
                <button type="submit">Add Product</button>
            </form>
            <p id="message" class="message" aria-live="polite"></p>

            <h3>Add Category</h3>
            <form id="categoryForm" class="category-form">
                <input type="text" id="categoryName" placeholder="Category name" required>
                <button type="submit">Add Category</button>
            </form>
            <p id="categoryMessage" class="message" aria-live="polite"></p>
        </div>

        <div class="card">
            <h2>Inventory</h2>
            <div class="inventory-controls">
                <input type="text" id="searchInput" placeholder="Search by ID or product name">
                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="">All categories</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Stock Value</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>

            <div class="inventory-summary">
                <span id="productCount">Products: 0</span>
                <strong id="totalValue">Total Stock Value: ₹0</strong>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
